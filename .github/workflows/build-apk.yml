name: Build MVK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          MVK_KEYSTORE_PASSWORD: ${{ secrets.MVK_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$MVK_KEYSTORE_PASSWORD" ]; then
            echo "::error::The MVK_KEYSTORE_PASSWORD secret is missing. Without it the APK would be signed with a throwaway key and could not update the installed app."
            exit 1
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK and record its signature
        run: |
          cp app/build/outputs/apk/release/app-release.apk MVK.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs MVK.apk | tee signer.txt
          grep -qi "FE:5E:F0:4A\|fe5ef04a" signer.txt || { echo "::error::APK is not signed with the MVK release key"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: MVK-apk
          path: MVK.apk

      - name: Publish APK to the "apk" branch
        run: |
          mkdir out && cp MVK.apk signer.txt out/ && cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add MVK.apk signer.txt
          git commit -qm "MVK.apk from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
